# Configuración mínima de Mosquitto para Telmeow.
#
# Se necesitan DOS listeners porque los dos extremos del sistema hablan
# protocolos distintos:
#
#   1883 (TCP crudo)  -> el pipeline de Python (paho-mqtt)
#   9001 (WebSocket)  -> el visor 3D en el navegador
#
# Un navegador NO puede abrir una conexión TCP cruda: solo WebSocket. Si solo
# se abre el 1883, el publisher de Python funciona pero el visor nunca conecta,
# y el síntoma es engañoso porque el broker parece estar bien.
#
# Uso:
#     mosquitto -c mosquitto.conf -v
#
# allow_anonymous vale para desarrollo local. Para una demostración en red
# abierta habría que añadir autenticación.

listener 1883
listener 9001
protocol websockets
allow_anonymous true
